{% set name = "tifffile" %}
{% set version = "2026.10.15" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a5ee666dbd6d62e059830a3450825a2521a981b3f45c07a80ab009484aef56f0

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  entry_points:
    - tifffile = tifffile:main
    - tiffcomment = tifffile.tiffcomment:main
    - tiff2fsspec = tifffile.tiff2fsspec:main
    - lsm2bin = tifffile.lsm2bin:main

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy >=2.1
  run_constrained:
    # codecs
    - imagecodecs >=2026.8.16
    # zarr
    - zarr >=3.3.0

# Skip due to AssertionsError - no presence of newline. This is a test issue.
# Also skip test_func_pformat_xml on Windows due to quote style mismatch.
{% set skipped_tests = [
  "test_class_omexml_modulo",
  "test_class_omexml_attributes",
  "test_class_omexml_datasets",
  "test_class_omexml_multiimage"
] %}
{% set skipped_tests_win = [
  "test_class_omexml",
  "test_func_pformat_xml"
] %}

{% set disabled_tests = " test_class_omexml_modulo" %}  # [not win]
{% set disabled_tests = disabled_tests + " or test_class_omexml_attributes" %} # [not win]
{% set disabled_tests = disabled_tests + " or test_class_omexml_datasets" %}  # [not win]
{% set disabled_tests = disabled_tests + " or test_class_omexml_multiimage" %}  # [not win]

{% set disabled_tests = " test_class_omexml" %}  # [win]
{% set disabled_tests = disabled_tests + " or test_func_pformat_xml" %}  # [win]

test:
  source_files:
    - tests
  imports:
    - tifffile
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - tifffile --help
    - tiff2fsspec --help
    - pytest -vv tests -k "not ({{disabled_tests}})"

about:
  home: https://github.com/cgohlke/tifffile
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  description: |
    Tifffile is a Python library to store NumPy arrays in TIFF (Tagged Image File Format) files, and read image and metadata from TIFF-like files used in bioimaging.
  summary: Read and write image data from and to TIFF files.
  doc_url: https://github.com/cgohlke/tifffile/blob/master/README.rst
  dev_url: https://github.com/cgohlke/tifffile

extra:
  recipe-maintainers:
    - blink1073
    - ericpre
    - jakirkham
    - mrakitin
    - ocefpaf
    - stuarteberg
